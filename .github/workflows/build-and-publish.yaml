# Automatically builds wheels + sdist, publishes to PyPI, and creates a GitHub Release
# whenever a new version in `pyproject.toml` is merged/pushed to `main`:
#
# To build and install locally for testing, run:
# py -m pip install "/path/to/python-lib-xulbux" --no-deps --no-cache-dir --force-reinstall -vv

name: Build and Publish
permissions: {}

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_release:
    name: Check Release Version
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check if release version already exists
        id: check
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
          REF: ${{ github.ref }}
        run: |
          VERSION=$(python3 -c "from xulbux import __version__; print(__version__)")
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1 || gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release '${TAG}' already exists; skipping release publish."
            SHOULD_RELEASE="false"
          elif [[ "$REF" == "refs/heads/main" ]]; then
            SHOULD_RELEASE="true"
          else
            SHOULD_RELEASE="false"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from `CHANGELOG.md`
        if: steps.check.outputs.should_release == 'true'
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import pathlib, re
          from xulbux import __version__

          changelog = pathlib.Path("CHANGELOG.md").read_text("utf-8")
          releases = re.findall(r'<Release\s+version="([^"]+)"[^>]*>\s*(.*?)\s*</Release>', changelog, flags=re.DOTALL)

          body = f"Release `v{__version__}`."
          prev_ver = ""
          for idx, (ver, content) in enumerate(releases):
              if ver.strip().lstrip("v") == __version__:
                  body = content.strip()
                  if idx + 1 < len(releases):
                      prev_ver = releases[idx + 1][0].split("-")[-1].strip().lstrip("v")
                  break

          anchor = f"v{__version__.replace('.', '-')}"
          url = f"https://xulbux.github.io/python-lib-xulbux/changelog#{anchor}"
          compare_line = (
              f"**Full Changelog**: https://github.com/xulbux/python-lib-xulbux/compare/v{prev_ver}...v{__version__}\n\n"
              if prev_ver
              else ""
          )
          changelog_line = (
              f"⚠️ This release contains breaking changes. See [`v{__version__}` in the changelog]({url}) on the website."
              if "#### Breaking Changes" in body
              else f"See [`v{__version__}` in the changelog]({url}) on the website."
          )

          pathlib.Path("release-notes.md").write_text(
              f"{body}\n\n---\n\n{compare_line}{changelog_line}\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.should_release == 'true'
        with:
          name: release-notes
          path: release-notes.md

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: check_release
    if: needs.check_release.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3
        env:
          CIBW_BUILD: cp312-* cp313-* cp314-*
          CIBW_SKIP: '*-musllinux_*'
          CIBW_BUILD_FRONTEND: pip
          CIBW_ENVIRONMENT: XULBUX_USE_MYPYC=1

      - name: Verify wheels were built
        run: |
          ls -la ./wheelhouse/
          if [ -z "$(ls -A ./wheelhouse/)" ]; then
            echo "[ERROR] No wheels were built!"
            exit 1
          fi
          echo "[SUCCESS] Built $(ls ./wheelhouse/*.whl | wc -l) wheels."
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: check_release
    if: needs.check_release.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI & GitHub Releases
    needs: [check_release, build_wheels, build_sdist]
    if: needs.check_release.outputs.should_release == 'true' && github.repository == 'xulbux/python-lib-xulbux'
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: 'wheels-*'
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check_release.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" \
            dist/* \
            --target "$TARGET_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md
