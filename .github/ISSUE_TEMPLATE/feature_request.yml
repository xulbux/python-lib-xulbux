name: Feature Request
description: Propose a new utility, module enhancement, CLI flag, or documentation improvement.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to add or improve, which module does it belong in, and why?
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Example API or Usage (optional)
      description: Sample Python call signature, CLI command, or expected output.
      render: python

