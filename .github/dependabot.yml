# Weekly grouped dependency updates (with 3-day supply-chain cooldown) for `website` `pnpm` packages
# and GitHub Actions workflows (`pyproject.toml` minimum version bounds are managed manually):

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/website'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 3
    groups:
      website-dependencies:
        patterns:
          - '*'
    ignore:
      # `vue-tsc` (`@volar/typescript`) requires `typescript <7`, and `vitepress` requires `markdown-it-mathjax3 ^4`:
      - dependency-name: 'typescript'
        versions: ['>= 7.0.0']
      - dependency-name: 'markdown-it-mathjax3'
        versions: ['>= 5.0.0']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - '*'

